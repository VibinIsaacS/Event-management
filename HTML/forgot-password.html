<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <!-- Fixed CSS relative paths -->
    <link rel="stylesheet" href="../CSS/login.css">
    <link rel="stylesheet" href="../CSS/navbar.css">
</head>
<body>
  <div id="header-placeholder"></div>
  <video class="video-bg" autoplay muted loop playsinline>
    <source src="../Assets/eventblurred.mp4" type="video/mp4">
  </video>
  
  <form class="login-form" id="forgotPasswordForm">
    <h2>Forgot Password</h2>
    <p id="message" style="color: white; text-align: center; min-height: 1.2em; line-height: 1.4;"></p>
    <div class="input-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Enter your registered email" required>
    </div>
    <button type="submit">Send Reset Link</button>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.0"></script>
  <!-- Fixed Javascript folder paths -->
  <script src="../Javascript/appwrite-config.js"></script>
  <script src="../Javascript/navbar.js"></script>
  <script>
    document.getElementById('forgotPasswordForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const messageEl = document.getElementById('message');
      const email = document.getElementById('email').value;
      const submitButton = event.target.querySelector('button');
      
      messageEl.textContent = 'Sending...';
      submitButton.disabled = true;

      try {
        // Changed to dynamic URL mapping depending on deployment so you don't get stuck!
        const resetUrl = window.location.origin + window.location.pathname.replace('forgot-password.html', 'reset-password.html');
        
        await account.createRecovery(email, resetUrl);
        messageEl.style.color = '#b8f28a'; 
        messageEl.textContent = 'Success! Please check your email for a password reset link.';
      } catch (error) {
        messageEl.style.color = 'red';
        messageEl.textContent = error.message;
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
