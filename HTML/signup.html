<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <!-- Fixed relative paths for CSS -->
    <link rel="stylesheet" href="../CSS/signup.css">
    <link rel="stylesheet" href="../CSS/navbar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
  <div id="header-placeholder"></div>
  <video class="video-bg" autoplay muted loop playsinline>
    <source src="../Assets/eventblurred.mp4" type="video/mp4">
  </video>
  <form class="signup-form" id="signupForm">
    <h2>Sign Up</h2>
    <!-- 1. Change the color here! For example, changing it to a nice bright orange (#ffb703) -->
    <p id="error-message" style="color: #ffb703; text-align: center; font-weight: bold; padding-bottom: 10px;"></p>
    <div class="input-group">
      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
    </div>
    <div class="input-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>
    </div>
    <div class="input-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Min 8 chars, 1 uppercase, 1 number, 1 symbol" required minlength="8">
    </div>
    <div class="input-group">
      <label for="confirm-password">Confirm Password</label>
      <input type="password" id="confirm-password" name="confirm-password" placeholder="Re-enter your password" required>
    </div>
    <button type="submit" class="signup-btn">Sign Up</button>
    <div style="width: 100%; text-align: center; margin-top: 18px;">
      <!-- Link mapped correctly to ROOT login page -->
      <p style="color: #fff;">Already have an account? <a href="../Login.html" style="color: #7b2ff2; font-weight: bold; text-decoration: underline;">Login</a></p>
    </div>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.0"></script>
  <!-- Path mapped to Javascript folder correctly -->
  <script src="../Javascript/appwrite-config.js"></script>
  <script src="../Javascript/navbar.js"></script>
  
  <script>
    document.getElementById('signupForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const errorMessage = document.getElementById('error-message');
        errorMessage.textContent = ''; 

        const name = document.getElementById('fullname').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm-password').value;

        // Password security policy validation
        // Requires: 1 Uppercase, 1 Number, 1 Symbol, and at least 8 characters long
        const passwordRegex = /^(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*(),.?":{}|<>_\-+=;~`[\]\\\/]).{8,}$/;

        if (!passwordRegex.test(password)) {
            errorMessage.textContent = 'Password must be at least 8 characters long and include 1 uppercase letter, 1 number, and 1 symbol.';
            return;
        }

        if (password !== confirmPassword) {
            errorMessage.textContent = 'Passwords do not match!';
            return;
        }

        try {
            await account.create(ID.unique(), email, password, name);
            await account.createEmailSession(email, password);
            window.location.href = '../Index.html'; 

        } catch (error) {
            console.error('Failed to create user:', error);
            
            // 2. Change the text here by intercepting Appwrite's default message!
            if (error.message.includes("already exists")) {
                errorMessage.textContent = "This email is already registered. Please login instead!";
            } else if (error.message.includes("password")) {
                errorMessage.textContent = "Password must be at least 8 characters long.";
            } else {
                // Fallback for any other unexpected errors
                errorMessage.textContent = "Oops! Something went wrong. Please try again.";
            }
        }
    });
  </script>
</body>
</html>
